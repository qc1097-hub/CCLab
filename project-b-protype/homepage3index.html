<!DOCTYPE html>
<html>

<head>
    <title>[ Friendship Donut Homepage 3 ]</title>

    <!-- allow special characters, including Arabic, Chinese, Korean, Japanese, etc. -->
    <meta charset="UTF-8">
    <!-- link the style sheet -->
    <link rel="stylesheet" type="text/css" href="style.css">

    <!-- prevent scrolling -->
    <script>
        window.addEventListener("keydown", function (e) {
            if ([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) {
                e.preventDefault();
            }
        }, false);
    </script>

    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Asset&family=DM+Serif+Text:ital@0;1&family=Funnel+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">

    <!-- p5.js (keep ONLY this version) -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/addons/p5.sound.min.js"></script>

    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="utf-8" />

</head>

<body>
    <!-- title -->
    <div id="title-wrapper">
        <h1 class="headline black"> Friendship Donut </h1>
    </div>

    <!-- main content -->
    <div id="main-wrapper">
        <div id="p5-canvas-container">
            <!-- This is where your p5 sketch will be appended and appear! -->
        </div>

        <div class="two-columns">
            <div class="left"></div>

            <!-- Include your sketch.js file -->
            <script src="homepage3sketch.js" type="text/javascript"></script>
        </div>
    </div>

</body>

</html>
